name: Build CubeXP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cubexp.dol
        run: make -j"$(nproc)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubexp
          path: cubexp.dol

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CubeXP (latest build)
          body: |
            Automatic build of the newest commit.
            Download **cubexp.dol** and open it in Dolphin (File > Open), or copy it to your SD card and launch it with Swiss.
          files: cubexp.dol
